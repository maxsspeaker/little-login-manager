name: Build plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGIN_NAME: little-login-manager

jobs:
  # ---------------------------------------------------------------------------
  # Linux
  # ---------------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system deps (Nuitka + Qt WebEngine)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            patchelf ccache zip \
            libnss3 libxkbcommon-x11-0 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libasound2t64 libegl1 libgl1 libdbus-1-3 libfontconfig1

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build browser.py with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: "4.2.2"
          script-name: browser.py
          mode: standalone
          output-dir: dist
          output-file: ${{ env.PLUGIN_NAME }}
          enable-plugins: pyside6

      - name: Assemble plugin folder
        shell: bash
        run: |
          set -euo pipefail

          dist_dir="$(find dist -maxdepth 1 -type d -name '*.dist' | head -n 1)"
          if [ -z "$dist_dir" ]; then
            echo "::error::Nuitka *.dist folder not found"
            exit 1
          fi

          out="package/${PLUGIN_NAME}"
          mkdir -p "$out"

          # собранный браузер -> browser.dist
          mv "$dist_dir" "$out/browser.dist"

          # файлы плагина
          cp index.py meta.json icon.png "$out/"

          # проверяем, что index.py найдёт исполняемый файл
          test -f "$out/browser.dist/${PLUGIN_NAME}"

          echo "Plugin layout:"
          find "$out" -maxdepth 2 | sort

      - name: Archive plugin
        shell: bash
        run: |
          cd package
          zip -r -y "../${PLUGIN_NAME}-linux.zip" "${PLUGIN_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-linux
          path: ${{ env.PLUGIN_NAME }}-linux.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows
  # ---------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pillow

      - name: Make .ico from icon.png
        shell: pwsh
        run: |
          python -c "from PIL import Image; Image.open('icon.png').convert('RGBA').save('build_icon.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build browser.py with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: "4.2.2"
          script-name: browser.py
          mode: standalone
          output-dir: dist
          output-file: ${{ env.PLUGIN_NAME }}
          windows-console-mode: disable
          windows-icon-from-ico: build_icon.ico
          enable-plugins: pyside6

      - name: Assemble plugin folder
        shell: bash
        run: |
          set -euo pipefail

          dist_dir="$(find dist -maxdepth 1 -type d -name '*.dist' | head -n 1)"
          if [ -z "$dist_dir" ]; then
            echo "::error::Nuitka *.dist folder not found"
            exit 1
          fi

          out="package/${PLUGIN_NAME}"
          mkdir -p "$out"

          # собранный браузер -> browser.dist
          mv "$dist_dir" "$out/browser.dist"

          # файлы плагина
          cp index.py meta.json icon.png "$out/"

          # проверяем, что index.py найдёт исполняемый файл
          test -f "$out/browser.dist/${PLUGIN_NAME}.exe"

          echo "Plugin layout:"
          find "$out" -maxdepth 2 | sort

      - name: Archive plugin
        shell: pwsh
        run: |
          Compress-Archive -Path "package/$env:PLUGIN_NAME" -DestinationPath "$env:PLUGIN_NAME-windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-windows
          path: ${{ env.PLUGIN_NAME }}-windows.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Публикация nightly-релиза
  # ---------------------------------------------------------------------------
  publish-nightly:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move nightly tag to current commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f nightly
          git push -f origin nightly

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: Update nightly release
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: "Little Login Manager - nightly"
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          artifacts: "release-assets/*.zip"
